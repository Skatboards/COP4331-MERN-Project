name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: ${{ matrix.workspace }} quality
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        workspace: [client, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Warn about high-severity production client vulnerabilities
        if: matrix.workspace == 'client'
        working-directory: client/runtime
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/client-runtime-npm-audit.json"

          set +e
          npm audit --omit=dev --audit-level=high --json > "$audit_file"
          audit_status=$?
          set -e

          if jq --exit-status . "$audit_file" >/dev/null 2>&1; then
            high_count="$(jq --raw-output '.metadata.vulnerabilities.high // 0' "$audit_file")"
            critical_count="$(jq --raw-output '.metadata.vulnerabilities.critical // 0' "$audit_file")"
            if (( high_count > 0 || critical_count > 0 )); then
              echo "::warning file=client/runtime/package-lock.json,title=Production npm vulnerabilities::npm audit found ${high_count} high and ${critical_count} critical vulnerabilities in the client runtime dependencies."
              {
                echo '## Production client dependency warning'
                echo
                echo "npm audit found **${high_count} high** and **${critical_count} critical** vulnerabilities."
                echo 'Review the audit log and `client/runtime/package-lock.json`.'
              } >> "$GITHUB_STEP_SUMMARY"
            elif (( audit_status != 0 )); then
              echo '::warning file=client/runtime/package-lock.json,title=npm audit unavailable::npm audit did not complete successfully; review the step log.'
            fi
          else
            echo '::warning file=client/runtime/package-lock.json,title=npm audit unavailable::npm audit did not return a valid report; review the step log.'
          fi

          cat "$audit_file"

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint --if-present

      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: npm run build --if-present

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: npm run test --if-present

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 15
    env:
      IMAGE_TAG: ci-${{ github.sha }}
      CLIENT_PORT: ${{ vars.CLIENT_PORT || '5173' }}
      BACKEND_PORT: ${{ vars.BACKEND_PORT || '3000' }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE || 'GameDB' }}
      APP_URL: http://localhost:5173
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

    steps:
      - uses: actions/checkout@v4

      - name: Validate development Compose configuration
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.dev
          load: true
          tags: sweeple-backend-dev:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Build development client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: sweeple-client-dev:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=client-dev
          cache-to: type=gha,mode=max,scope=client-dev

      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          tags: sweeple-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build production client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          load: true
          tags: sweeple-client:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=client-prod
          cache-to: type=gha,mode=max,scope=client-prod

      - name: Start prebuilt production services
        run: docker compose -f compose.prod.yaml up --detach --no-build --wait --wait-timeout 180

      - name: Show service status
        run: docker compose -f compose.prod.yaml ps

      - name: Test production client routes
        run: |
          set -euo pipefail
          for route in / /play /archive /archive/daily-2026-10-20 /settings; do
            curl --fail --silent --show-error "http://localhost:${CLIENT_PORT}${route}" |
              grep --quiet '<div id="root"></div>'
          done

      - name: Test Express health endpoint
        run: |
          curl --fail --silent --show-error "http://localhost:${BACKEND_PORT}/api/health" |
            jq --exit-status '.status == "ok"'

      - name: Test missing assets and cache headers
        run: |
          set -euo pipefail
          missing_status="$(curl --silent --output /tmp/missing-asset --write-out '%{http_code}' \
            "http://localhost:${CLIENT_PORT}/assets/does-not-exist.js")"
          test "$missing_status" = 404
          if grep --quiet '<div id="root"></div>' /tmp/missing-asset; then
            exit 1
          fi
          curl --silent --dump-header /tmp/index-headers --output /tmp/index.html \
            "http://localhost:${CLIENT_PORT}/"
          grep --ignore-case --quiet '^cache-control: no-cache' /tmp/index-headers
          asset_path="$(grep --only-matching --extended-regexp '/assets/[^" ]+\.js' /tmp/index.html | head -n 1)"
          test -n "$asset_path"
          curl --silent --dump-header /tmp/asset-headers --output /dev/null \
            "http://localhost:${CLIENT_PORT}${asset_path}"
          grep --ignore-case --quiet '^cache-control: public, max-age=31536000, immutable' /tmp/asset-headers

      - name: Verify production runtime and empty database
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.prod.yaml exec -T client id -u)" != 0
          docker compose -f compose.prod.yaml exec -T mongo \
            mongosh --quiet "$MONGO_DATABASE" --eval \
            'const total = db.users.countDocuments({}) + db.boards.countDocuments({}) + db.boardAttempts.countDocuments({}); if (total !== 0) { quit(1); }'

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -f compose.prod.yaml down --volumes --remove-orphans

  deploy:
    name: Deploy to droplet
    # Only after a push to main, and only once every check above has passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, compose]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 30

    env:
      DROPLET_HOST: ${{ vars.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_APP_PATH: ${{ secrets.DROPLET_APP_PATH }}
      # The droplet's public SSH host key, so the job only talks to that server
      DROPLET_HOST_KEY: ${{ vars.DROPLET_HOST_KEY }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      DEPLOY_SHA: ${{ github.sha }}
      RUNTIME_ENV_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate configuration and create protected runtime environment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CLIENT_PORT: ${{ vars.CLIENT_PORT }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          MONGO_DATABASE: ${{ vars.MONGO_DATABASE || 'GameDB' }}
          APP_URL: ${{ vars.APP_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          required=(
            DROPLET_HOST DROPLET_USER DROPLET_APP_PATH DROPLET_HOST_KEY
            SSH_PRIVATE_KEY PUBLIC_URL CLIENT_PORT BACKEND_PORT APP_URL
            JWT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing production environment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          invalid=()
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || invalid+=(DEPLOY_SHA)
          [[ "$RUNTIME_ENV_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]] || invalid+=(RUNTIME_ENV_ID)
          [[ "$DROPLET_HOST" != *[[:space:]]* ]] || invalid+=(DROPLET_HOST)
          [[ "$DROPLET_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || invalid+=(DROPLET_USER)
          [[ "$DROPLET_APP_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || invalid+=(DROPLET_APP_PATH)
          [[ "$DROPLET_HOST_KEY" =~ ^[A-Za-z0-9@._+-]+[[:space:]][A-Za-z0-9+/=]+$ ]] || invalid+=(DROPLET_HOST_KEY)
          [[ "$PUBLIC_URL" == https://* ]] || invalid+=(PUBLIC_URL)
          [[ "$APP_URL" == https://* ]] || invalid+=(APP_URL)
          if [[ "$CLIENT_PORT" =~ ^[0-9]+$ ]]; then
            (( CLIENT_PORT >= 1 && CLIENT_PORT <= 65535 )) || invalid+=(CLIENT_PORT)
          else
            invalid+=(CLIENT_PORT)
          fi
          if [[ "$BACKEND_PORT" =~ ^[0-9]+$ ]]; then
            (( BACKEND_PORT >= 1 && BACKEND_PORT <= 65535 )) || invalid+=(BACKEND_PORT)
          else
            invalid+=(BACKEND_PORT)
          fi
          if [[ "$SMTP_PORT" =~ ^[0-9]+$ ]]; then
            (( SMTP_PORT >= 1 && SMTP_PORT <= 65535 )) || invalid+=(SMTP_PORT)
          else
            invalid+=(SMTP_PORT)
          fi
          [[ "$SMTP_SECURE" == true || "$SMTP_SECURE" == false ]] || invalid+=(SMTP_SECURE)
          if [[ -n "$SMTP_USER" && -z "$SMTP_PASS" ]]; then
            missing+=(SMTP_PASS)
          elif [[ -n "$SMTP_PASS" && -z "$SMTP_USER" ]]; then
            missing+=(SMTP_USER)
          fi
          if [[ -n "$SMTP_HOST" ]]; then
            [[ -n "$MAIL_FROM_NAME" ]] || missing+=(MAIL_FROM_NAME)
            [[ -n "$MAIL_FROM_ADDRESS" ]] || missing+=(MAIL_FROM_ADDRESS)
          fi

          runtime_names=(
            PUBLIC_URL CLIENT_PORT BACKEND_PORT MONGO_DATABASE APP_URL JWT_SECRET
            SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS
            MAIL_FROM_NAME MAIL_FROM_ADDRESS
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
          )
          for name in "${runtime_names[@]}"; do
            value="${!name-}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              invalid+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing production environment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [ "${#invalid[@]}" -ne 0 ]; then
            printf 'Invalid production environment configuration: %s\n' "${invalid[*]}" >&2
            exit 1
          fi

          runtime_file="$RUNNER_TEMP/sweeple-production.env"
          umask 077
          : > "$runtime_file"
          for name in "${runtime_names[@]}"; do
            value="${!name-}"
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$name" "$value" >> "$runtime_file"
          done
          chmod 600 "$runtime_file"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$DROPLET_HOST" "$DROPLET_HOST_KEY" > ~/.ssh/known_hosts

      - name: Install protected runtime environment
        run: |
          set -euo pipefail
          remote_directory="$DROPLET_APP_PATH/.deploy/environments"
          remote_upload="$remote_directory/$RUNTIME_ENV_ID.env.$GITHUB_RUN_ID.upload"
          remote_environment="$remote_directory/$RUNTIME_ENV_ID.env"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            "install -d -m 700 '$DROPLET_APP_PATH/.deploy' '$remote_directory'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/sweeple-production.env" \
            "$DROPLET_USER@$DROPLET_HOST:$remote_upload"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            "set -e
             trap 'rm -f \"$remote_upload\" \"$remote_environment.tmp\"' EXIT
             install -m 600 '$remote_upload' '$remote_environment.tmp'
             mv -f '$remote_environment.tmp' '$remote_environment'"

      - name: Deploy the exact tested release
        id: deploy_release
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            bash -s -- "$DROPLET_APP_PATH" "$DEPLOY_SHA" "$RUNTIME_ENV_ID" <<'REMOTE'
          set -euo pipefail
          app_path="$1"
          deploy_sha="$2"
          runtime_env_id="$3"
          cd "$app_path"
          git fetch --prune origin main
          git cat-file -e "${deploy_sha}^{commit}"
          git checkout --detach --force "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          bash deploy/release.sh deploy "$deploy_sha" "$runtime_env_id"
          REMOTE

      - name: Check the public HTTPS health endpoint
        id: public_health
        run: |
          set -euo pipefail
          public_url="${PUBLIC_URL%/}"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 180 \
            --connect-timeout 10 \
            --max-time 20 \
            "$public_url/api/health" |
            jq --exit-status '.status == "ok"'

      - name: Record the successful release and prune old cache
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            "cd '$DROPLET_APP_PATH' && bash deploy/release.sh finalize '$DEPLOY_SHA' '$RUNTIME_ENV_ID'"

      - name: Roll back after a failed replacement or public check
        id: rollback
        if: ${{ failure() && (steps.deploy_release.outcome == 'failure' || steps.public_health.outcome == 'failure') }}
        run: |
          set -euo pipefail
          set +e
          rollback_output="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            "cd '$DROPLET_APP_PATH' && bash deploy/release.sh rollback '$DEPLOY_SHA' '$RUNTIME_ENV_ID'" 2>&1)"
          rollback_status=$?
          set -e
          printf '%s\n' "$rollback_output"
          if grep --quiet '^ROLLBACK_PERFORMED=true$' <<< "$rollback_output"; then
            printf '%s\n' 'performed=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'performed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$rollback_status"

      - name: Check public health after rollback
        if: ${{ always() && steps.rollback.outputs.performed == 'true' }}
        run: |
          set -euo pipefail
          public_url="${PUBLIC_URL%/}"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 180 \
            --connect-timeout 10 \
            --max-time 20 \
            "$public_url/api/health" |
            jq --exit-status '.status == "ok"'

      - name: Remove deployment credentials and temporary files
        if: always()
        run: rm -f ~/.ssh/deploy_key "$RUNNER_TEMP/sweeple-production.env"
