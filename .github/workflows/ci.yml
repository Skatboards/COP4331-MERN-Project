name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: ${{ matrix.workspace }} quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace: [client, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint --if-present

      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: npm run build --if-present

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: npm run test --if-present

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 180

      - name: Show service status
        run: docker compose ps

      - name: Test client page
        run: curl --fail --silent --show-error http://localhost:5173/ | grep --quiet '<div id="root"></div>'

      - name: Test Express health endpoint
        run: curl --fail --silent --show-error http://localhost:3000/api/health | jq --exit-status '.status == "ok"'

      - name: Test health endpoint through Vite proxy
        run: curl --fail --silent --show-error http://localhost:5173/api/health | jq --exit-status '.status == "ok"'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
