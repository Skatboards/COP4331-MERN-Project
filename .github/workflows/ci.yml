name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: ${{ matrix.workspace }} quality
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        workspace: [client, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint --if-present

      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: npm run build --if-present

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: npm run test --if-present

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 15
    env:
      IMAGE_TAG: ci-${{ github.sha }}
      CLIENT_PORT: ${{ vars.CLIENT_PORT || '5173' }}
      BACKEND_PORT: ${{ vars.BACKEND_PORT || '3000' }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE || 'GameDB' }}
      APP_URL: http://localhost:5173
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

    steps:
      - uses: actions/checkout@v4

      - name: Validate development Compose configuration
        run: docker compose -f compose.dev.yaml config --quiet

      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.dev
          load: true
          tags: sweeple-backend-dev:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Build development client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: sweeple-client-dev:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=client-dev
          cache-to: type=gha,mode=max,scope=client-dev

      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          tags: sweeple-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build production client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          load: true
          tags: sweeple-client:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=client-prod
          cache-to: type=gha,mode=max,scope=client-prod

      - name: Start prebuilt production services
        run: docker compose -f compose.prod.yaml up --detach --no-build --wait --wait-timeout 180

      - name: Show service status
        run: docker compose -f compose.prod.yaml ps

      - name: Test production client routes
        run: |
          set -euo pipefail
          for route in / /play /archive /archive/daily-2026-10-20 /settings; do
            curl --fail --silent --show-error "http://localhost:${CLIENT_PORT}${route}" |
              grep --quiet '<div id="root"></div>'
          done

      - name: Test Express health endpoint
        run: |
          curl --fail --silent --show-error "http://localhost:${BACKEND_PORT}/api/health" |
            jq --exit-status '.status == "ok"'

      - name: Test missing assets and cache headers
        run: |
          set -euo pipefail
          missing_status="$(curl --silent --output /tmp/missing-asset --write-out '%{http_code}' \
            "http://localhost:${CLIENT_PORT}/assets/does-not-exist.js")"
          test "$missing_status" = 404
          if grep --quiet '<div id="root"></div>' /tmp/missing-asset; then
            exit 1
          fi
          curl --silent --dump-header /tmp/index-headers --output /tmp/index.html \
            "http://localhost:${CLIENT_PORT}/"
          grep --ignore-case --quiet '^cache-control: no-cache' /tmp/index-headers
          asset_path="$(grep --only-matching --extended-regexp '/assets/[^" ]+\.js' /tmp/index.html | head -n 1)"
          test -n "$asset_path"
          curl --silent --dump-header /tmp/asset-headers --output /dev/null \
            "http://localhost:${CLIENT_PORT}${asset_path}"
          grep --ignore-case --quiet '^cache-control: public, max-age=31536000, immutable' /tmp/asset-headers

      - name: Verify production runtime and empty database
        run: |
          set -euo pipefail
          test "$(docker compose -f compose.prod.yaml exec -T client id -u)" != 0
          docker compose -f compose.prod.yaml exec -T mongo \
            mongosh --quiet "$MONGO_DATABASE" --eval \
            'const total = db.users.countDocuments({}) + db.boards.countDocuments({}) + db.boardAttempts.countDocuments({}); if (total !== 0) { quit(1); }'

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -f compose.prod.yaml down --volumes --remove-orphans

  deploy:
    name: Deploy to droplet
    # Only after a push to main, and only once every check above has passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, compose]
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15

    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_APP_PATH: /home/mern/sweeple
      DEPLOY_SHA: ${{ github.sha }}
      # The droplet's public SSH host key, so the job only talks to that server
      DROPLET_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP9HNw3Y+r+twBKVtDP0LnfkDK0IH/FsBhfB5yZnLGXG

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$DROPLET_HOST" "$DROPLET_HOST_KEY" > ~/.ssh/known_hosts

      - name: Pull main and rebuild the production stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "set -e
             cd '$DROPLET_APP_PATH'
             git fetch --prune origin main
             git reset --hard origin/main
             export IMAGE_TAG='$DEPLOY_SHA'
             docker compose -f compose.prod.yaml config --quiet
             docker compose -f compose.prod.yaml build backend
             docker compose -f compose.prod.yaml build client
             docker compose -f compose.prod.yaml up -d --no-build --remove-orphans --wait --wait-timeout 300
             docker image prune -f"

      - name: Check the deployed stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DROPLET_USER@$DROPLET_HOST" \
            "cd '$DROPLET_APP_PATH' && \
             export IMAGE_TAG='$DEPLOY_SHA' && \
             docker compose -f compose.prod.yaml exec -T backend node -e \
               \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""
