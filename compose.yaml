
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
